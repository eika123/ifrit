services:
  ca:
    build:
      context: .
      dockerfile: Containerfile
    container_name: ifrit-ca
    command: ["ifrit-ca", "--new", "--host=0.0.0.0", "--port=8321", "--path=/data/ifrit-cad"]
    ports:
      - "8321:8321"
    networks:
      - ifrit-net
    volumes:
      - ca-data:/data/ifrit-cad
  gossip-node:
    build:
      context: .
      dockerfile: Containerfile
    command: ["gossip-node"]
    depends_on:
      - ca
    deploy:
      replicas: ${NODES:-3}
    environment:
      - IFRIT_CONFIG=/app/ifrit_config.yaml
    volumes:
      - ./_examples/ifrit_container_config.yaml:/app/ifrit_config.yaml:ro
    networks:
      - ifrit-net
  # Continuous background chaos daemon for experiments
  chaos-pumba:
    image: docker.io/gaiaadm/pumba:latest
    container_name: ifrit-pumba
    depends_on:
      - gossip-node
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --log-level
      - ${PUMBA_LOG_LEVEL:-info}
      - --interval
      - 1m
      - netem
      - --duration
      - 55s
      - --interface
      - eth0
      - delay
      - --time
      - ${DELAY_MS:-50}
      - --jitter
      - ${JITTER_MS:-10}
      - loss
      - --percent
      - ${LOSS_PERCENT:-1}
      - corrupt
      - --percent
      - ${CORRUPT_PERCENT:-1}
      - "re2:.*gossip-node.*"
    networks:
      - ifrit-net
networks:
  ifrit-net:
    driver: bridge
volumes:
  ca-data:
