services:
  ca:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifrit-ca
    command: [ "ifrit-ca", "--new", "--host=0.0.0.0", "--port=8321", "--path=/data/ifrit-cad" ]
    ports:
      - "8321:8321"
    networks:
      - ifrit-net
    volumes:
      - ca-data:/data/ifrit-cad
  gossip-node:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "gossip-node" ]
    depends_on:
      - ca
    deploy:
      replicas: ${NODES:-3}
    environment:
      - IFRIT_CONFIG=/app/ifrit_config.yaml
      - IFRIT_TELEMETRY_DB=/results
      - IFRIT_TELEMETRY_CHECKPOINT_INTERVAL=${IFRIT_TELEMETRY_CHECKPOINT_INTERVAL:-10s}
      - IFRIT_NODE_NAME=${IFRIT_NODE_NAME:-}
    volumes:
      - ./_examples/ifrit_container_config.yaml:/app/ifrit_config.yaml:ro
      - ./experiment_results:/results
    networks:
      - ifrit-net
  # Continuous background chaos daemon for experiments
  chaos-pumba:
    image: docker.io/gaiaadm/pumba:latest
    container_name: ifrit-pumba
    depends_on:
      - gossip-node
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --log-level
      - ${PUMBA_LOG_LEVEL:-info}
      - --interval
      - ${PUMBA_INTERVAL:-1m}
      - netem
      - --duration
      - ${PUMBA_DURATION:-55s}
      - --interface
      - eth0
      - delay
      - --time
      - ${DELAY_MS:-50}
      - --jitter
      - ${JITTER_MS:-10}
      - loss
      - --percent
      - ${LOSS_PERCENT:-1}
      - corrupt
      - --percent
      - ${CORRUPT_PERCENT:-1}
      - "re2:.*gossip-node.*"
    networks:
      - ifrit-net
  # Passive Network Observer daemon (monitors UDP Ping/Pong & TCP Gossip wire bytes)
  network-observer:
    build:
      context: .
      dockerfile: experiments/observer/Containerfile
    container_name: ifrit-observer
    depends_on:
      - ca
      - gossip-node
    # For the observer to see all container traffic on ifrit-net, it must run on the host network
    # A standard container's eth0 only receives unicast packets directed to its own MAC address plus broadcast packets.
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - BPF
      - PERFMON
    environment:
      - TELEMETRY_DB=${TELEMETRY_DB:-/results/network_telemetry.db}
    volumes:
      - ./experiment_results:/results
    command: [ "-db", "${TELEMETRY_DB:-/results/network_telemetry.db}", "-iface", "ifrit-br0" ]
networks:
  ifrit-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "ifrit-br0"
volumes:
  ca-data:

