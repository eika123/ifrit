syntax = "proto3";

package reconcile.transfer;
option go_package = "github.com/eika123/ifrit/reconcile/transfer/proto;transferpb";

service ItemTransfer {
  // Bidirectional chunked transfer of missing items (triggered when diffs != empty).
  rpc Sync(stream SyncFrame) returns (stream SyncFrame);
}

message SyncFrame {
  oneof payload {
    WantDigests want_digests   = 1;
    DataItemHeader data_header = 2;
    DataItemChunk data_chunk   = 3;
    DataItemEnd data_end       = 4;
    SyncComplete complete      = 5;
  }
}

message WantDigests {
  repeated bytes digests = 1;
}

message DataItemHeader {
  bytes digest     = 1;
  int64 total_size = 2;
}

message DataItemChunk {
  bytes data = 1;
}

message DataItemEnd {
  bytes digest = 1;
}

message SyncComplete {
  bytes fingerprint = 1;
}
