syntax = "proto3";

package reconcile.naive;
option go_package = "github.com/eika123/ifrit/reconcile/naive/proto;naivepb";

service NaiveReconciler {
  // Phase 1: Exchange batched digest lists and compute A\B and B\A diffs.
  rpc ExchangeDigests(stream DigestBatch) returns (stream DigestDiffBatch);
}

message DigestBatch {
  bytes fingerprint      = 1; // Optional fingerprint on first frame
  repeated bytes digests = 2; // Encoded 8-byte DigestSymbols
}

message DigestDiffBatch {
  bytes fingerprint                = 1; // Responder store fingerprint
  repeated bytes requested_digests = 2; // A \ B: responder wants from caller
  repeated bytes available_digests = 3; // B \ A: caller wants from responder
}
