services:
  ca:
    build:
      context: ../..
      dockerfile: examples/dht/Dockerfile
    command: ["ifrit-ca", "--new", "--host=0.0.0.0", "--port=8321", "--path=/tmp/ifrit-ca"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8321"]
      interval: 1s
      timeout: 1s
      retries: 15
    networks:
      - dht-net

  dht-1:
    build:
      context: ../..
      dockerfile: examples/dht/Dockerfile
    command:
      - "dht-node"
      - "-hostname=dht-1"
      - "-ca=ca:8321"
      - "-http-port=8080"
      - "-service-id=dht"
      - "-cert-path=/tmp/certs"
    depends_on:
      ca:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - dht-net

  dht-2:
    build:
      context: ../..
      dockerfile: examples/dht/Dockerfile
    command:
      - "dht-node"
      - "-hostname=dht-2"
      - "-ca=ca:8321"
      - "-http-port=8080"
      - "-service-id=dht"
      - "-cert-path=/tmp/certs"
    depends_on:
      ca:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - dht-net

networks:
  dht-net:
    driver: bridge
