syntax = "proto3";

package proto;
option go_package = "github.com/eika123/ifrit/protobuf;proto";

service gossip {
    rpc Spread (State) returns (StateResponse) {}
    rpc Messenger (Msg) returns (MsgResponse) {}
    rpc Stream (stream Msg) returns (stream MsgResponse) {}
}

message State {
    Note ownNote = 1;
    bool is_rebuttal = 2;
}

// Application message
message Msg {
    bytes content = 1;
} 

// Application response
message MsgResponse {
    bytes content = 1;
    string error = 2;
}

message StateResponse {
    repeated Accusation accusations = 1;
}

// Raw certificate
message Certificate {
    bytes raw = 1;
}

// accuser and accused are the respective node ids
message Accusation {
    uint64 epoch = 1;
    bytes accuser = 2;
    bytes accused = 3;
    Signature signature = 4;
    uint32 ringNum = 5;
}

message Note {
    uint64 epoch = 1;
    bytes id = 2;
    uint32 mask = 3;
    Signature signature = 4;
}

// Raw elliptic signature
message Signature {
    bytes r = 1;
    bytes s = 2;
}

message Ping {
    bytes nonce = 1;
}

message Pong {
    bytes nonce = 1;
    Signature signature = 2;
    bytes fingerprint_data = 3;
    bytes fingerprint_accusations = 4;
    bytes fingerprint_view = 5;
    bytes fingerprint_services = 6;
}
