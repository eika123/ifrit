syntax = "proto3";

package proto;
option go_package = "github.com/eika123/ifrit/protobuf;proto";

service Fireflies {
    rpc Announce (AnnounceRequest) returns (AnnounceResponse) {}
}

message AnnounceRequest {
    Note own_note = 1;
    bool is_rebuttal = 2;
}

message AnnounceResponse {
    repeated Accusation accusations = 1;
}

// Raw certificate
message Certificate {
    bytes raw = 1;
}

// accuser and accused are the respective node ids
message Accusation {
    uint64 epoch = 1;
    bytes accuser = 2;
    bytes accused = 3;
    Signature signature = 4;
    uint32 ringNum = 5;
}

message Note {
    uint64 epoch = 1;
    bytes id = 2;
    uint32 mask = 3;
    Signature signature = 4;
}

// Raw elliptic signature
message Signature {
    bytes r = 1;
    bytes s = 2;
}

message Ping {
    bytes nonce = 1;
}

message Pong {
    bytes nonce = 1;
    Signature signature = 2;
    bytes fingerprint_data = 3;
    bytes fingerprint_accusations = 4;
    bytes fingerprint_view = 5;
    bytes fingerprint_services = 6;
}
